<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8BD8FF"/>
    </linearGradient>
  </defs>
  <!-- radar ring, open at the top-right: the "eye" that looks ahead -->
  <path d="M55.2 22.4A26 26 0 1 1 41.6 8.8" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- the A: an arrowhead leaning into the storm -->
  <path d="M19 47 32 15.5 45 47" stroke="url(#g)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- crossbar as a sweep line -->
  <path d="M25 36.5h14" stroke="#8BD8FF" stroke-width="3" stroke-linecap="round"/>
  <!-- the cell ahead -->
  <circle cx="51.5" cy="12.5" r="3.6" fill="#FFB43A"/>
  <circle cx="51.5" cy="12.5" r="6.4" stroke="#FFB43A" stroke-opacity=".35" stroke-width="1.2"/>
</svg>
